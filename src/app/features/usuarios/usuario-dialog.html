<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo usuario' : 'Editar usuario' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Usuario</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
      @if (data.mode === 'edit') {
        <mat-hint>Dejar vacío para no cambiar</mat-hint>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Rol</mat-label>
      <mat-select formControlName="id_rol">
        @for (rol of roles(); track rol.id) {
          <mat-option [value]="rol.id">{{ rol.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-checkbox formControlName="estado" class="span-2">Activo</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
