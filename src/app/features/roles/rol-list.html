<div class="page-head">
  <h1>Roles</h1>
  <button mat-flat-button color="primary" type="button" class="action-create" (click)="nuevo()">
    <mat-icon>add</mat-icon>Nuevo
  </button>
</div>
@if (loading) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombre"
        ><th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre }}</td></ng-container
      >
      <ng-container matColumnDef="descripcion"
        ><th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let r">{{ r.descripcion || '-' }}</td></ng-container
      >
      <ng-container matColumnDef="salario"
        ><th mat-header-cell *matHeaderCellDef>Salario</th>
        <td mat-cell *matCellDef="let r">{{ money(r.salario) }}</td></ng-container
      >
      <ng-container matColumnDef="activo"
        ><th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-chip" [class.active]="r.activo" [class.inactive]="!r.activo">
            {{ yesNo(r.activo) }}
          </span>
        </td></ng-container
      >
      <ng-container matColumnDef="acciones"
        ><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button
          ><button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
