<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo rol' : 'Editar rol' }}</h2>
<mat-dialog-content class="dialog-body"
  ><form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label><input matInput formControlName="nombre"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Salario</mat-label><input matInput type="number" formControlName="salario"
    /></mat-form-field>
    <mat-form-field appearance="outline" class="span-2"
      ><mat-label>Descripción</mat-label
      ><textarea matInput formControlName="descripcion"></textarea>
    </mat-form-field>
    <mat-checkbox formControlName="activo" class="span-2">Activo</mat-checkbox>
  </form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button mat-button (click)="cancel()">Cancelar</button
  ><button mat-flat-button color="primary" (click)="save()">Guardar</button></mat-dialog-actions
>
