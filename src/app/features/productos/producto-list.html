<div class="page-head">
  <h1>Productos</h1>
  <button mat-flat-button color="primary" (click)="nuevo()"><mat-icon>add</mat-icon>Nuevo</button>
</div>
@if (loading) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombre"
        ><th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre }}</td></ng-container
      >
      <ng-container matColumnDef="codigo_barras"
        ><th mat-header-cell *matHeaderCellDef>C?digo</th>
        <td mat-cell *matCellDef="let r">{{ r.codigo_barras || '?' }}</td></ng-container
      >
      <ng-container matColumnDef="precio_venta"
        ><th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let r">{{ money(r.precio_venta) }}</td></ng-container
      >
      <ng-container matColumnDef="id_tipo"
        ><th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.id_tipo) }}</td></ng-container
      >
      <ng-container matColumnDef="id_proveedor"
        ><th mat-header-cell *matHeaderCellDef>Proveedor</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.id_proveedor) }}</td></ng-container
      >
      <ng-container matColumnDef="estado"
        ><th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let r">{{ yesNo(r.estado) }}</td></ng-container
      >
      <ng-container matColumnDef="acciones"
        ><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button
          ><button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
