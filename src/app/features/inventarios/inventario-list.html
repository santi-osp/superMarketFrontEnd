<div class="page-head">
  <h1>Inventarios</h1>
  <div class="head-actions">
    <button mat-flat-button color="primary" class="action-create" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nuevo
    </button>
    <button mat-stroked-button class="action-refresh" (click)="reload()">
      <mat-icon>refresh</mat-icon>
      Recargar
    </button>
  </div>
</div>

@if (loading) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id_producto">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let r"><span class="id-pill">{{ shortId(r.id_producto) }}</span></td>
      </ng-container>

      <ng-container matColumnDef="id_sucursal">
        <th mat-header-cell *matHeaderCellDef>Sucursal</th>
        <td mat-cell *matCellDef="let r"><span class="id-pill">{{ shortId(r.id_sucursal) }}</span></td>
      </ng-container>

      <ng-container matColumnDef="stock_actual">
        <th mat-header-cell *matHeaderCellDef>Stock actual</th>
        <td mat-cell *matCellDef="let r"><span class="count-badge">{{ r.stock_actual }}</span></td>
      </ng-container>

      <ng-container matColumnDef="stock_minimo">
        <th mat-header-cell *matHeaderCellDef>Stock mínimo</th>
        <td mat-cell *matCellDef="let r"><span class="count-badge">{{ r.stock_minimo }}</span></td>
      </ng-container>

      <ng-container matColumnDef="ubicacion">
        <th mat-header-cell *matHeaderCellDef>Ubicación</th>
        <td mat-cell *matCellDef="let r">{{ r.ubicacion || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-chip" [class.active]="r.estado" [class.inactive]="!r.estado">
            {{ yesNo(r.estado) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="eliminar(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
