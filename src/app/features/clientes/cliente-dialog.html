<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo cliente' : 'Editar cliente' }}</h2>

<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput type="text" formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo ID</mat-label>
      <input matInput type="text" formControlName="tipo_identificacion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Identificación</mat-label>
      <input matInput type="text" formControlName="identificacion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput type="text" formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Dirección</mat-label>
      <textarea matInput formControlName="direccion"></textarea>
    </mat-form-field>

    <mat-checkbox formControlName="estado" class="span-2">Activo</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()">Guardar</button>
</mat-dialog-actions>
