<div class="page-head"><h1>Empleados</h1><button mat-flat-button color="primary" (click)="nuevo()"><mat-icon>add</mat-icon>Nuevo</button></div>
@if (loading) { <div class="loading"><mat-spinner /></div> } @else { <div class="table-wrap mat-elevation-z2"><table mat-table [dataSource]="dataSource">
<ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef>Nombre</th><td mat-cell *matCellDef="let r">{{ r.nombre }}</td></ng-container><ng-container matColumnDef="username"><th mat-header-cell *matHeaderCellDef>Usuario</th><td mat-cell *matCellDef="let r">{{ r.username }}</td></ng-container><ng-container matColumnDef="identificacion"><th mat-header-cell *matHeaderCellDef>Identificaci?n</th><td mat-cell *matCellDef="let r">{{ r.identificacion }}</td></ng-container><ng-container matColumnDef="cargo"><th mat-header-cell *matHeaderCellDef>Cargo</th><td mat-cell *matCellDef="let r">{{ r.cargo || '?' }}</td></ng-container><ng-container matColumnDef="id_rol"><th mat-header-cell *matHeaderCellDef>Rol</th><td mat-cell *matCellDef="let r">{{ shortId(r.id_rol) }}</td></ng-container><ng-container matColumnDef="estado"><th mat-header-cell *matHeaderCellDef>Activo</th><td mat-cell *matCellDef="let r">{{ yesNo(r.estado) }}</td></ng-container><ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let r" class="actions"><button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button><button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button></td></ng-container><tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns"></tr></table><mat-paginator [pageSizeOptions]="[5,10,25]" showFirstLastButtons /></div> }
