<mat-sidenav-container #sidenavShell="matSidenavContainer" class="shell" autosize>
  <mat-sidenav mode="side" opened class="nav-rail" [class.collapsed]="sidebarCollapsed()">
    <div class="nav-brand">
      <div class="nav-brand__mark">
        <mat-icon class="nav-brand__icon">local_grocery_store</mat-icon>
      </div>
      @if (!sidebarCollapsed()) {
        <div class="nav-brand__text">
          <span class="nav-brand__title">SuperMarket</span>
          <span class="nav-brand__sub">Gestion operativa</span>
        </div>
      }
    </div>

    <mat-nav-list class="nav-list">
      @for (item of nav; track item.path) {
        <a
          mat-list-item
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [matTooltip]="sidebarCollapsed() ? item.label : ''"
          matTooltipPosition="right"
          [matTooltipDisabled]="!sidebarCollapsed()"
        >
          <mat-icon matListItemIcon class="nav-item__icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="nav-footer">
      <button
        mat-flat-button
        type="button"
        class="logout-btn logout-btn--side"
        (click)="logout()"
        [matTooltip]="sidebarCollapsed() ? 'Cerrar sesion' : ''"
        matTooltipPosition="right"
        aria-label="Cerrar sesion"
      >
        <mat-icon>logout</mat-icon>
        @if (!sidebarCollapsed()) {
          <span>Cerrar sesion</span>
        }
      </button>

      <button
        mat-stroked-button
        type="button"
        class="collapse-btn"
        (click)="toggleSidebar()"
        [matTooltip]="sidebarCollapsed() ? 'Expandir menu' : 'Colapsar menu'"
        matTooltipPosition="right"
      >
        <span class="collapse-btn__icon">
          <mat-icon>{{ sidebarCollapsed() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
        </span>
        @if (!sidebarCollapsed()) {
          <span class="collapse-btn__label">Ocultar menu</span>
        }
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-column">
    <mat-toolbar class="top-bar">
      <button
        mat-icon-button
        type="button"
        class="menu-toggle"
        (click)="toggleSidebar()"
        aria-label="Alternar menu lateral"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Panel</span>
      <span class="spacer"></span>
      <button
        mat-flat-button
        type="button"
        class="logout-btn logout-btn--top"
        (click)="logout()"
        aria-label="Cerrar sesion"
      >
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesion</span>
      </button>
    </mat-toolbar>
    <main class="content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
