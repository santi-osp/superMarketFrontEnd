<div class="page-head">
  <h1>Proveedores</h1>
  <button mat-flat-button color="primary" class="action-create" (click)="nuevo()"><mat-icon>add</mat-icon>Nuevo</button>
</div>
@if (loading) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombre"
        ><th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre || '-' }}</td></ng-container
      ><ng-container matColumnDef="nit"
        ><th mat-header-cell *matHeaderCellDef>NIT</th>
        <td mat-cell *matCellDef="let r">{{ r.nit || '-' }}</td></ng-container
      ><ng-container matColumnDef="correo"
        ><th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let r">{{ r.correo || '-' }}</td></ng-container
      ><ng-container matColumnDef="telefono"
        ><th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let r">{{ r.telefono || '-' }}</td></ng-container
      ><ng-container matColumnDef="direccion"
        ><th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let r">{{ r.direccion || '-' }}</td></ng-container
      ><ng-container matColumnDef="estado"
        ><th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-chip" [class.active]="r.estado" [class.inactive]="!r.estado">
            {{ yesNo(r.estado) }}
          </span>
        </td></ng-container
      >
      <ng-container matColumnDef="acciones"
        ><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button (click)="editar(r)"><mat-icon>edit</mat-icon></button
          ><button mat-icon-button (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
