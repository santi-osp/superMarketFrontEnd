<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo proveedor' : 'Editar proveedor' }}</h2>
<mat-dialog-content class="dialog-body"
  ><form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label
      ><input matInput type="text" formControlName="nombre" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>NIT</mat-label
      ><input matInput type="text" formControlName="nit" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Correo</mat-label
      ><input matInput type="email" formControlName="correo" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Teléfono</mat-label
      ><input matInput type="text" formControlName="telefono" /></mat-form-field
    ><mat-form-field appearance="outline" class="span-2"
      ><mat-label>Dirección</mat-label
      ><textarea matInput formControlName="direccion"></textarea></mat-form-field
    ><mat-checkbox formControlName="estado" class="span-2">Activo</mat-checkbox>
  </form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button mat-button (click)="cancel()">Cancelar</button
  ><button mat-flat-button color="primary" (click)="save()">Guardar</button></mat-dialog-actions
>
